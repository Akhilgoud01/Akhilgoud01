<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60" role="img" aria-label="connect"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><animate attributeName="x1" values="0;-1;0" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="1;0;1" dur="9s" repeatCount="indefinite"/><stop offset="0" stop-color="#00f5ff"/><stop offset=".5" stop-color="#7c4dff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset="1" stop-color="#0d1426"/></linearGradient>
